name: Terraform Azure

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
  # Push CI only when remote state is configured (see job if:).
  # Without TF_STATE_STORAGE_ACCOUNT, empty local state makes plan useless/noisy.
  push:
    branches: [main, master]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: terraform

jobs:
  plan:
    name: Terraform plan
    # Skip push runs until remote state exists (avoid empty-state false failures)
    if: >
      github.event_name != 'push' ||
      vars.TF_STATE_STORAGE_ACCOUNT != ''
    runs-on: ubuntu-latest
    environment: azure-prod
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Azure OIDC secrets
        run: |
          missing=0
          [ -n "$ARM_CLIENT_ID" ] || { echo "AZURE_CLIENT_ID missing"; missing=1; }
          [ -n "$ARM_TENANT_ID" ] || { echo "AZURE_TENANT_ID missing"; missing=1; }
          [ -n "$ARM_SUBSCRIPTION_ID" ] || { echo "AZURE_SUBSCRIPTION_ID missing"; missing=1; }
          exit "$missing"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (local or remote backend)
        run: |
          if [ -n "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" ]; then
            printf '%s\n' 'terraform {' '  backend "azurerm" {}' '}' > backend.tf
            terraform init -input=false \
              -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP || 'rg-entcopilot-tfstate' }}" \
              -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
              -backend-config="container_name=${{ vars.TF_STATE_CONTAINER || 'tfstate' }}" \
              -backend-config="key=${{ vars.TF_STATE_KEY || 'enterprise-copilot.tfstate' }}" \
              -backend-config="use_oidc=true"
          else
            echo "No TF_STATE_STORAGE_ACCOUNT — local backend (plan may diverge from real Azure)"
            terraform init -input=false
          fi

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        env:
          TF_VAR_gitops_target_revision: ${{ github.ref_name }}
        run: |
          REPO_URL="${{ vars.GITOPS_REPO_URL }}"
          if [ -z "$REPO_URL" ]; then
            REPO_URL="https://github.com/${{ github.repository }}.git"
          fi
          export TF_VAR_gitops_repo_url="$REPO_URL"
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const body = `#### Terraform plan\n\`\`\`\n${plan.substring(0, 60000)}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  apply:
    name: Terraform apply
    needs: plan
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.apply == true) ||
      (github.event_name == 'push' && vars.TF_AUTO_APPLY == 'true' && vars.TF_STATE_STORAGE_ACCOUNT != '')
    runs-on: ubuntu-latest
    environment: azure-prod
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init (remote)
        run: |
          printf '%s\n' 'terraform {' '  backend "azurerm" {}' '}' > backend.tf
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP || 'rg-entcopilot-tfstate' }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER || 'tfstate' }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'enterprise-copilot.tfstate' }}" \
            -backend-config="use_oidc=true"

      - name: Terraform apply
        env:
          TF_VAR_gitops_target_revision: main
        run: |
          REPO_URL="${{ vars.GITOPS_REPO_URL }}"
          if [ -z "$REPO_URL" ]; then
            REPO_URL="https://github.com/${{ github.repository }}.git"
          fi
          export TF_VAR_gitops_repo_url="$REPO_URL"
          terraform apply -auto-approve -input=false
