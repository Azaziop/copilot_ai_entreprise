name: Build and push to ACR

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "terraform/**"
      - "docs/**"
      - "**/*.md"
      - "ansible/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (default: short SHA)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: write

env:
  BACKEND_IMAGE: copilot-backend
  FRONTEND_IMAGE: copilot-frontend
  AKS_RG: rg-entcopilot
  AKS_NAME: aks-entcopilot

jobs:
  build-push:
    name: Build / push / bump GitOps tags
    runs-on: ubuntu-latest
    environment: azure-prod
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      acr_login_server: ${{ steps.acr.outputs.login_server }}
      public_api_url: ${{ steps.apiurl.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/setup-kubectl@v4

      - name: AKS credentials
        run: az aks get-credentials -g "$AKS_RG" -n "$AKS_NAME" --overwrite-existing

      - name: Resolve ACR login server
        id: acr
        run: |
          if [ -n "${{ vars.ACR_LOGIN_SERVER }}" ]; then
            echo "login_server=${{ vars.ACR_LOGIN_SERVER }}" >> "$GITHUB_OUTPUT"
          else
            SERVER=$(az acr list --query "[0].loginServer" -o tsv)
            echo "login_server=$SERVER" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PUBLIC_API_URL (Ingress /api preferred)
        id: apiurl
        run: |
          chmod +x scripts/wait_ingress_ip.sh
          # Prefer live Ingress IP (repo var may be stale after LB→Ingress cutover)
          if kubectl -n ingress-nginx get svc ingress-nginx-controller >/dev/null 2>&1; then
            IP=$(INGRESS_WAIT_TIMEOUT=180 scripts/wait_ingress_ip.sh || true)
            if [ -n "${IP:-}" ]; then
              echo "url=http://${IP}/api" >> "$GITHUB_OUTPUT"
              echo "Resolved Ingress API URL: http://${IP}/api"
              exit 0
            fi
          fi
          if [ -n "${{ vars.PUBLIC_API_URL }}" ]; then
            echo "url=${{ vars.PUBLIC_API_URL }}" >> "$GITHUB_OUTPUT"
            echo "Fallback repo variable PUBLIC_API_URL"
            exit 0
          fi
          echo "url=http://PENDING_INGRESS_IP/api" >> "$GITHUB_OUTPUT"
          echo "WARNING: no Ingress IP and no PUBLIC_API_URL"

      - name: Image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: az acr login --name "$(echo '${{ steps.acr.outputs.login_server }}' | cut -d. -f1)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.acr.outputs.login_server }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ steps.acr.outputs.login_server }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.apiurl.outputs.url }}
          tags: |
            ${{ steps.acr.outputs.login_server }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ steps.acr.outputs.login_server }}/${{ env.FRONTEND_IMAGE }}:latest

      - name: Update Azure Kustomize image tags
        run: |
          python3 scripts/update_azure_kustomize.py \
            --acr "${{ steps.acr.outputs.login_server }}" \
            --tag "${{ steps.meta.outputs.tag }}"

      - name: Patch configmap API URL in GitOps
        if: ${{ !contains(steps.apiurl.outputs.url, 'PENDING') }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          url = os.environ["API_URL"]
          path = Path("k8s/overlays/azure/patch-configmap.yaml")
          text = path.read_text(encoding="utf-8")
          lines = []
          for line in text.splitlines():
              if line.strip().startswith("NEXT_PUBLIC_API_URL:"):
                  lines.append(f'  NEXT_PUBLIC_API_URL: "{url}"')
              else:
                  lines.append(line)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"configmap -> {url}")
          PY
        env:
          API_URL: ${{ steps.apiurl.outputs.url }}

      - name: Commit GitOps tag bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/azure/kustomization.yaml k8s/overlays/azure/patch-configmap.yaml
          if git diff --staged --quiet; then
            echo "No kustomize changes"
            exit 0
          fi
          git commit -m "chore(gitops): bump images to ${{ steps.meta.outputs.tag }}"
          git push
