apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enterprise-copilot
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Azaziop/copilot_ai_entreprise.git
    targetRevision: main
    path: k8s/overlays/azure
  destination:
    server: https://kubernetes.default.svc
    namespace: enterprise-copilot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
