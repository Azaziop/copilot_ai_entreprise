# Example only — do NOT put real keys in Git.
# Create the real secret on the cluster:
#   kubectl -n enterprise-copilot create secret generic rag-secrets \
#     --from-literal=OPENROUTER_API_KEY='...' \
#     --from-literal=LANGCHAIN_API_KEY='...'
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
type: Opaque
stringData:
  OPENROUTER_API_KEY: "REPLACE_ME"
  LANGCHAIN_API_KEY: "REPLACE_ME"
