apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base
  - secrets.yaml

images:
  - name: copilot-backend
    newName: copilot-backend
    newTag: latest
  - name: copilot-frontend
    newName: copilot-frontend
    newTag: latest

patches:
  - path: patch-services-nodeport.yaml
  - path: patch-pull-policy.yaml
  - path: patch-configmap.yaml

