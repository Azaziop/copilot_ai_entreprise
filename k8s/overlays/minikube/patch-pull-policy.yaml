apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          imagePullPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
spec:
  template:
    spec:
      containers:
        - name: frontend
          imagePullPolicy: Never
