# Single public entry (Ingress NGINX LoadBalancer).
# Browser → http://<INGRESS_IP>/          → frontend
# Browser → http://<INGRESS_IP>/api/...    → backend (rewrite → /...)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-copilot
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: rag-backend-service
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-copilot-web
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-frontend-service
                port:
                  number: 3000
