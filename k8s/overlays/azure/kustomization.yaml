apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enterprise-copilot

resources:
  - ../../base

# CI updates newName/newTag after each ACR push
images:
  - name: copilot-backend
    newName: ACR_LOGIN_SERVER_PLACEHOLDER/copilot-backend
    newTag: latest
  - name: copilot-frontend
    newName: ACR_LOGIN_SERVER_PLACEHOLDER/copilot-frontend
    newTag: latest

patches:
  - path: patch-services-lb.yaml
  - path: patch-pull-policy.yaml
  - path: patch-configmap.yaml
