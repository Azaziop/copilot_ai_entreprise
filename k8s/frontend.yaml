# LEGACY — prefer: kubectl apply -k k8s/overlays/minikube
# Canonical manifests: k8s/base + k8s/overlays/*
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  labels:
    app: rag-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-frontend
  template:
    metadata:
      labels:
        app: rag-frontend
    spec:
      containers:
      - name: frontend
        image: copilot-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://127.0.0.1:18000"
---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend-service
spec:
  type: NodePort
  selector:
    app: rag-frontend
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080
